name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install conversion dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-pil ffmpeg poppler-utils
      - name: Run conversion, gesture, and installer tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
